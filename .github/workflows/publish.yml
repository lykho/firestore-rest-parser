name: CI
on:
  push:
    branches:
      - "main"
permissions:
  contents: read
  id-token: write
jobs:
  build:
    name: Build, lint, test and publish to NPM
    runs-on: "ubuntu-latest"
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Use Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Publish to NPM
        run: npm publish
